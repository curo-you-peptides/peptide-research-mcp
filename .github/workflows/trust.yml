name: Set npm trusted publisher (one time)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npx -y npm@12.2.1 trust github curo-peptides --repo curo-you-peptides/peptide-research-mcp --file publish.yml --allow-publish --yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npx -y npm@12.2.1 trust list curo-peptides
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
